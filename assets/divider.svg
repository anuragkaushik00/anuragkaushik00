<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="1000" height="28" role="presentation">

  <defs>

    <filter id="glow" x="-5%" y="-300%" width="110%" height="700%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <linearGradient
      id="flow"
      gradientUnits="userSpaceOnUse"
      x1="0"
      y1="0"
      x2="500"
      y2="0"
      spreadMethod="repeat"
    >
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.4" stop-color="#7c3aed"/>
      <stop offset="0.75" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#00f5ff"/>

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="0 0"
        to="500 0"
        dur="4s"
        repeatCount="indefinite"
      />
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.85" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <mask id="m">
      <rect width="1000" height="28" fill="url(#fade)"/>
    </mask>

  </defs>

  <g mask="url(#m)">
    <rect
      x="0"
      y="12"
      width="1000"
      height="4"
      rx="2"
      fill="url(#flow)"
      filter="url(#glow)"
      opacity="0.9"
    />

    <rect
      x="0"
      y="13"
      width="1000"
      height="2"
      rx="1"
      fill="url(#flow)"
    />
  </g>

  <rect
    x="490"
    y="4"
    width="20"
    height="20"
    rx="5"
    transform="rotate(45 500 14)"
    fill="#ffffff"
    fill-opacity="0.10"
    stroke="#ffffff"
    stroke-opacity="0.45"
  />

  <circle cx="500" cy="14" r="3" fill="#00f5ff">
    <animate
      attributeName="opacity"
      values="1;0.3;1"
      dur="2s"
      repeatCount="indefinite"
    />
  </circle>

</svg>