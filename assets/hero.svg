<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Anurag Kaushik, Software Engineer, Data Analyst, AI and Automation">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,Menlo,'Courier New',monospace; }
    </style>

    <clipPath id="frame">
      <rect width="1000" height="340" rx="28"/>
    </clipPath>

    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.10"/>
    </pattern>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#150a2e"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.70"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0.50"/>
    </linearGradient>

    <linearGradient
      id="nameGrad"
      gradientUnits="userSpaceOnUse"
      x1="0"
      y1="0"
      x2="500"
      y2="0"
      spreadMethod="repeat"
    >
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.7" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#00f5ff"/>

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="0 0"
        to="500 0"
        dur="5s"
        repeatCount="indefinite"
      />
    </linearGradient>
  </defs>

  <!-- Background -->
  <g clip-path="url(#frame)">
    <rect width="1000" height="340" fill="url(#bg)"/>

    <g filter="url(#blur)">
      <circle cx="170" cy="90" r="140" fill="#00f5ff" opacity="0.55">
        <animate
          attributeName="cx"
          values="170;330;170"
          dur="14s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="cy"
          values="90;220;90"
          dur="14s"
          repeatCount="indefinite"
        />
      </circle>

      <circle cx="520" cy="300" r="150" fill="#7c3aed" opacity="0.75">
        <animate
          attributeName="cx"
          values="520;380;520"
          dur="17s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="cy"
          values="300;120;300"
          dur="17s"
          repeatCount="indefinite"
        />
      </circle>

      <circle cx="860" cy="70" r="130" fill="#f472b6" opacity="0.55">
        <animate
          attributeName="cx"
          values="860;680;860"
          dur="12s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="cy"
          values="70;240;70"
          dur="12s"
          repeatCount="indefinite"
        />
      </circle>
    </g>

    <rect width="1000" height="340" fill="url(#dots)"/>
  </g>

  <!-- Glass terminal window -->
  <rect
    x="40"
    y="40"
    width="920"
    height="260"
    rx="26"
    fill="#0b1020"
    fill-opacity="0.25"
  />

  <rect
    x="40"
    y="40"
    width="920"
    height="260"
    rx="26"
    fill="url(#glass)"
    stroke="url(#edge)"
    stroke-width="1.5"
  />

  <!-- Title bar -->
  <circle cx="72" cy="66" r="6" fill="#ff5f57"/>
  <circle cx="94" cy="66" r="6" fill="#febc2e"/>
  <circle cx="116" cy="66" r="6" fill="#28c840"/>

  <text
    x="500"
    y="70"
    text-anchor="middle"
    class="mono"
    font-size="12"
    fill="#94a3b8"
  >
    anurag@spicejet — zsh
  </text>

  <line
    x1="40"
    y1="88"
    x2="960"
    y2="88"
    stroke="#ffffff"
    stroke-opacity="0.12"
  />

  <!-- Floating code glyph -->
  <text
    x="720"
    y="215"
    class="mono"
    font-size="150"
    font-weight="800"
    fill="#ffffff"
    opacity="0.07"
  >
    &lt;/&gt;
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 -10;0 0"
      dur="6s"
      repeatCount="indefinite"
    />
  </text>

  <!-- whoami -->
  <text
    x="80"
    y="128"
    class="mono"
    font-size="16"
    fill="#7dd3fc"
    opacity="0.9"
  >
    $ whoami
  </text>

  <rect x="166" y="114" width="9" height="17" fill="#00f5ff">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1.1s"
      repeatCount="indefinite"
      calcMode="discrete"
    />
  </rect>

  <!-- Name -->
  <text
    x="80"
    y="192"
    class="mono"
    font-size="58"
    font-weight="800"
    fill="url(#nameGrad)"
  >
    Anurag Kaushik
  </text>

  <!-- Rotating roles -->
  <g class="mono" font-size="22" fill="#e5e7eb">

    <text x="80" y="234" opacity="0">
      <tspan fill="#00f5ff">&gt; </tspan>
      Automation Engineer @ SpiceJet

      <animate
        attributeName="opacity"
        values="0;1;1;0;0"
        keyTimes="0;0.02;0.22;0.25;1"
        dur="12s"
        repeatCount="indefinite"
      />
    </text>

    <text x="80" y="234" opacity="0">
      <tspan fill="#00f5ff">&gt; </tspan>
      Data Analyst · Power BI · SQL

      <animate
        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.25;0.27;0.47;0.5;1"
        dur="12s"
        repeatCount="indefinite"
      />
    </text>

    <text x="80" y="234" opacity="0">
      <tspan fill="#00f5ff">&gt; </tspan>
      LLM-powered Automation Builder

      <animate
        attributeName="opacity"
        values="0;0;1;1;0;0"
        keyTimes="0;0.5;0.52;0.72;0.75;1"
        dur="12s"
        repeatCount="indefinite"
      />
    </text>

    <text x="80" y="234" opacity="0">
      <tspan fill="#00f5ff">&gt; </tspan>
      Full-Stack · Next.js · TypeScript

      <animate
        attributeName="opacity"
        values="0;0;1;1;0"
        keyTimes="0;0.75;0.77;0.97;1"
        dur="12s"
        repeatCount="indefinite"
      />
    </text>

  </g>

  <!-- Tech chips -->
  <g
    class="mono"
    font-size="13"
    fill="#e5e7eb"
    text-anchor="middle"
  >

    <rect x="80" y="254" width="80" height="30" rx="15"
      fill="#ffffff" fill-opacity="0.08"
      stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="120" y="274">Python</text>

    <rect x="170" y="254" width="60" height="30" rx="15"
      fill="#ffffff" fill-opacity="0.08"
      stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="200" y="274">SQL</text>

    <rect x="240" y="254" width="100" height="30" rx="15"
      fill="#ffffff" fill-opacity="0.08"
      stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="290" y="274">Power BI</text>

    <rect x="350" y="254" width="90" height="30" rx="15"
      fill="#ffffff" fill-opacity="0.08"
      stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="395" y="274">Next.js</text>

    <rect x="450" y="254" width="110" height="30" rx="15"
      fill="#ffffff" fill-opacity="0.08"
      stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="505" y="274">TypeScript</text>

    <rect x="570" y="254" width="120" height="30" rx="15"
      fill="#ffffff" fill-opacity="0.08"
      stroke="#ffffff" stroke-opacity="0.28"/>
    <text x="630" y="274">Claude API</text>

  </g>

  <!-- Live status -->
  <rect
    x="725"
    y="254"
    width="205"
    height="30"
    rx="15"
    fill="#34d399"
    fill-opacity="0.10"
    stroke="#34d399"
    stroke-opacity="0.45"
  />

  <circle cx="746" cy="269" r="4" fill="#34d399">
    <animate
      attributeName="r"
      values="4;6.5;4"
      dur="1.8s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values="1;0.4;1"
      dur="1.8s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="762"
    y="273"
    class="mono"
    font-size="12"
    fill="#d1fae5"
  >
    building RFQ platform
  </text>

</svg>